<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação dos OKRs 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--line:#e0dfd8;--ink:#23222b;--muted:#6b6a72;--soft:#f0eef8;
  --pri:#2f2e3a;--pri-ink:#ffffff;--ok:#1D9E75;--bad:#E24B4A;--warn:#BA7517;--off:#9a99a0;
  --ok-bg:#e6f5ef;--bad-bg:#fcebeb;--off-bg:#efefef;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161c;--card:#211f28;--line:#34323d;--ink:#ecebf2;--muted:#a3a1ad;--soft:#2a2735;
  --pri:#e4e3ee;--pri-ink:#17161c;--ok:#3cc596;--bad:#f07170;--warn:#e0a24a;--off:#7f7d88;
  --ok-bg:#183229;--bad-bg:#3a1f22;--off-bg:#2b2a31;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161c;--card:#211f28;--line:#34323d;--ink:#ecebf2;--muted:#a3a1ad;--soft:#2a2735;
  --pri:#e4e3ee;--pri-ink:#17161c;--ok:#3cc596;--bad:#f07170;--warn:#e0a24a;--off:#7f7d88;
  --ok-bg:#183229;--bad-bg:#3a1f22;--off-bg:#2b2a31;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Sora,Inter,system-ui,sans-serif;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px}
.wide .wrap{max-width:980px}
.sync{font-size:12px;color:var(--muted)}
.sync[data-s="salvo"]{color:var(--ok)}.sync[data-s="erro"]{color:var(--bad);cursor:help}
.boxes.b5{grid-template-columns:repeat(5,1fr)}
.box .v small{font-size:14px;color:var(--muted);font-weight:500}
.cs summary.br{grid-template-columns:minmax(150px,220px) 1fr 80px}
small{font-size:12px;color:var(--muted)}
.clist{list-style:none;margin:0;padding:0}
.clist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.clist li b{font-weight:500}
.clist li p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
@media (max-width:760px){.boxes.b5{grid-template-columns:1fr 1fr}.cs summary.br{grid-template-columns:1fr 70px}}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted)}
.head b{color:var(--ink);font-weight:600}
.prog{height:4px;background:var(--line);border-radius:4px;margin:10px 0 28px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.ctx{font-size:13px;color:var(--muted);margin-bottom:4px}
.ctx b{color:var(--pri);font-weight:600}
.macro{font-size:14px;color:var(--ink);font-weight:500;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
h2{font-size:21px;font-weight:600}
.big h2{font-size:24px}
.desc{color:var(--muted);font-size:14px;margin:10px 0 0}
.more{background:none;border:0;color:var(--pri);font-size:13px;padding:0;margin-top:8px;cursor:pointer}
.plan{font-size:13px;color:var(--muted);margin-top:12px}

.q{margin-top:26px}
.ql{display:block;font-weight:500;font-size:14px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 0;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:14px;text-align:center}
.opt:hover{border-color:var(--muted)}
.opt.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.opt.on[data-v="Sim"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.on[data-v="Parcialmente"]{background:var(--warn);border-color:var(--warn);color:#fff}
.opt.on[data-v="Não"]{background:var(--bad);border-color:var(--bad);color:#fff}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
textarea{min-height:76px;resize:vertical}
.hide{display:none}

.metas{margin:18px 0 0;padding:0;list-style:none}
.metas li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.metas li b{font-family:Sora,sans-serif;font-weight:600}
.f{margin-top:18px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 22px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.link{border:0;background:none;color:var(--muted);padding:11px 4px}
.btn:disabled{visibility:hidden}

.ex{display:flex;gap:8px;margin-top:10px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;padding:0 8px}

.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.box{background:var(--bg);border-radius:10px;padding:14px}
.box .v{font-family:Sora,sans-serif;font-size:24px;font-weight:600}
.box .k{font-size:12.5px;color:var(--muted)}
.sec{margin-top:26px}
.sec h3{font-size:15px;margin-bottom:10px}
.br{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.bar{display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12.5px}
.pill{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.warn{background:var(--off-bg);color:var(--warn)}
.nd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px;cursor:pointer;width:fit-content}
.nd input{width:16px;height:16px;accent-color:var(--pri);margin:0}
input:disabled{opacity:.45}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.off{background:var(--off-bg);color:var(--muted)}
.kd summary{list-style:none;cursor:pointer;border-radius:8px;padding:6px 8px;margin:0 -8px 2px}
.kd summary::-webkit-details-marker{display:none}
.kd summary:hover{background:var(--soft)}
.kd summary>span:first-child::before{content:"›";display:inline-block;width:14px;color:var(--pri);transition:transform .2s}
.kd[open] summary>span:first-child::before{transform:rotate(90deg)}
.br.nop{padding:6px 8px 6px 22px;margin:0 -8px 2px}
.itens{list-style:none;margin:4px 0 14px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.itens li{display:flex;gap:10px;padding:8px 0 8px 6px;cursor:pointer;border-radius:6px;font-size:13.5px}
.itens li:hover{background:var(--soft)}
.itens .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px}
.itens b{font-weight:500}
.itens .tag{display:inline-block;margin-left:8px;font-size:12px;color:var(--muted)}
.itens p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sem-acoes .boxes,.sem-acoes .sec-exec{display:none}
.note{font-size:12.5px;color:var(--muted);margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.screen{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:560px){.card{padding:22px}.boxes{grid-template-columns:1fr 1fr}.br{grid-template-columns:1fr 50px}.br .bar{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.head .r{display:flex;align-items:center;gap:10px}
.icon{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.setlink{background:none;border:0;color:var(--pri);cursor:pointer;font-size:13px;padding:0}
.sets{display:grid;gap:10px;margin-top:22px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 18px;cursor:pointer}
.set:hover{border-color:var(--pri)}
.set b{font-family:Sora,sans-serif;font-weight:600;font-size:16px;display:block}
.set span{font-size:13px;color:var(--muted)}
.set .st{font-size:12.5px;white-space:nowrap;text-align:right;color:var(--muted)}
.obs{font-size:13px;background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:10px}

/* empresas: Fortes vermelho, F5 verde, Nexxus roxo */
:root{--c-fortes:#C62F2F;--c-f5:#1C8A4E;--c-nexxus:#6A3FD0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-fortes:#F07474;--c-f5:#45C98A;--c-nexxus:#A68BF2}}
:root[data-theme="dark"]{--c-fortes:#F07474;--c-f5:#45C98A;--c-nexxus:#A68BF2}
:root[data-emp="fortes"]{--pri:var(--c-fortes);--soft:color-mix(in srgb,var(--c-fortes) 10%,var(--card))}
:root[data-emp="f5"]{--pri:var(--c-f5);--soft:color-mix(in srgb,var(--c-f5) 10%,var(--card))}
:root[data-emp="nexxus"]{--pri:var(--c-nexxus);--soft:color-mix(in srgb,var(--c-nexxus) 10%,var(--card))}
.e-fortes{--ec:var(--c-fortes)}.e-f5{--ec:var(--c-f5)}.e-nexxus{--ec:var(--c-nexxus)}
#titulo{color:var(--pri);font-weight:600}
.emps{display:grid;gap:12px;margin-top:22px}
.emp{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-left:6px solid var(--ec);background:var(--card);border-radius:12px;padding:18px 20px;cursor:pointer}
.emp:hover{border-color:var(--ec)}
.emp b{font-family:Sora,sans-serif;font-weight:600;font-size:17px;display:block;color:var(--ec)}
.emp span{font-size:13px;color:var(--muted)}
.emp .st{white-space:nowrap;text-align:right}
.sets .set{border-left:5px solid var(--ec,var(--line))}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ec,var(--pri));margin-right:7px}
.eh{display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--ec);margin:18px 0 6px}
.eh .cdot{margin-right:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span><b>Avaliação dos OKRs 2026</b>, <span id="titulo"></span> <button class="setlink hide" id="trocar">Trocar setor</button></span><span class="r"><span id="sync" class="sync"></span><span id="pos"></span><button class="icon" id="tema" type="button"></button></span></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO DO SUPABASE: cole aqui a URL e a chave anon do projeto ===== */
const SUPABASE_URL="COLE_AQUI_A_URL_DO_PROJETO";
const SUPABASE_ANON_KEY="COLE_AQUI_A_CHAVE_ANON";
const CICLO="2026";
/* ================================================================================ */
let sb=null,REMOTO={};
try{if(window.supabase&&/^https:\/\//.test(SUPABASE_URL))sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}catch(e){}
function syncStatus(t){const e=document.getElementById("sync");if(!e||!sb)return;e.dataset.s=t;e.textContent={salvando:"Salvando...",salvo:"Salvo",erro:"Erro ao salvar",carregando:"Carregando..."}[t]||"";e.title=t==="erro"?"Não foi possível salvar no banco. As respostas continuam guardadas neste navegador.":"";}
async function baixarTudo(){if(!sb)return;syncStatus("carregando");
 const {data,error}=await sb.from("okr_avaliacoes").select("setor,respostas").eq("ciclo",CICLO);
 if(error){syncStatus("erro");return;}REMOTO={};(data||[]).forEach(r=>{REMOTO[r.setor]=r.respostas;});if(REMOTO.rh&&!REMOTO.nexxus_rh)REMOTO.nexxus_rh=REMOTO.rh;syncStatus("salvo");}
const DATA = {"suporte": [{"k": 0, "p": "Projeto Neo", "t": "Plataforma de atendimento omnichannel Neo", "d": "Integrar canais (telefone, WhatsApp, e-mail, chat e central de conteúdos).", "r": "Síndel", "q": "1º Trimestre", "o": "", "id": "s1", "st": "Em Andamento"}, {"k": 0, "p": "Projeto Neo", "t": "Treinar equipe para uso completo do Neo (dashboards, triagem, atendimentos simultâneos, fila em tempo real)", "d": "", "r": "Síndel", "q": "1º Trimestre", "o": "", "id": "s2", "st": "Em Andamento"}, {"k": 0, "p": "Projeto Neo", "t": "Parametrizar o Neo: horários, SLAs, filas e fluxos", "d": "Gestão: Parametrizar horários, SLAs, regras de fila e fluxos de atendimento. Validar registros automáticos de protocolos e históricos do cliente.", "r": "Letícia", "q": "1º Trimestre", "o": "", "id": "s3", "st": "Em Andamento"}, {"k": 0, "p": "Atendimento Inteligente", "t": "IA para processos administrativos", "d": "Atualização cadastral; Consulta a status de chamados.", "r": "Síndel", "q": "2º Trimestre", "o": "", "id": "s4", "st": "À iniciar"}, {"k": 0, "p": "Atendimento Inteligente", "t": "Configurar IA para atendimentos básicos e FAQs", "d": "Configurar IA para atendimentos básicos e FAQs Respostas automáticas para: Problemas simples e recorrentes; Passo a passo de funcionalidades Erros comuns de operação. Treinar a IA com top 20 motivos de atendimento Medir taxa de deflexão (atendimentos resolvidos sem ir para o analista)", "r": "Síndel", "q": "4º Trimestre", "o": "", "id": "s5", "st": "À iniciar"}, {"k": 1, "p": "Projeto Qualidade", "t": "Criar rotina semanal e mensal de análise dos detratores (CSAT < 4) com plano de ação para cada caso", "d": "", "r": "Lucas", "q": "2º Trimestre", "o": "", "id": "s6", "st": "À iniciar"}, {"k": 1, "p": "Projeto Qualidade", "t": "Desenvolver relatório mensal com insights de CSAT por técnico, para decisões de melhoria contínua", "d": "Feedbacks para os técnicos em tempo real.", "r": "Lucas", "q": "2º Trimestre", "o": "", "id": "s7", "st": "À in    <div class="box"><div class="v">${p(c.Parcialmente)}%</div><div class="k">parciais</div></div>
   <div class="box"><div class="v">${p(c["Não"])}%</div><div class="k">não realizadas</div></div>
   <div class="box"><div class="v">${kc.ok}<small> de ${tk}</small></div><div class="k">KRs atingidos</div></div>
   <div class="box"><div class="v">${kc.nd}</div><div class="k">KRs sem medição</div></div></div>
  ${geral}${setores}${motivos}
  ${lista("Indicadores sem medição",ndL,([a,b,o])=>`<li><b>${esc(b)}</b> <small>${esc(a)}</small>${o?`<p>${esc(o)}</p>`:""}</li>`)}
  ${lista("Metas revisadas pelos setores",revL,([a,b,o])=>`<li><b>${esc(b)}</b> <small>${esc(a)}</small>${o?`<p>${esc(o)}</p>`:""}</li>`)}
  ${lista("Sugestões para 2027",sugL,([a,b,f,o])=>`<li><b>${esc(b)}</b> <small>${esc(a)}</small><p>${esc(f||"")}${f&&o?": ":""}${esc(o||"")}</p></li>`)}
  ${lista("Feito fora do plano",foraL,([a,e])=>`<li>${esc(e)} <small>${esc(a)}</small></li>`)}
  <p class="note">${sb?"Respostas de todos os gestores, atualizadas ao abrir esta tela.":"Protótipo visual: mostra as respostas registradas neste navegador."}</p></div>`;}

function scrKR(i){const k=KRS[i],n=ACOES.filter(a=>a.k===i).length;
 return `<div class="card big"><div class="ctx"><b>KR ${i+1} de ${KRS.length}</b></div><h2>${esc(k.texto)}</h2>
  <ul class="metas">${k.campos.map(c=>`<li><span>${esc(c.label)}</span><b>${fmtMeta(c)}</b></li>`).join("")}</ul>
  ${k.nota?`<div class="obs">${esc(k.nota)}</div>`:""}
   <p class="desc">${n?`Você vai avaliar as ${n} ações planejadas para este KR, uma de cada vez. No final, informa o resultado alcançado.`:`Este KR não teve ações planejadas na planilha. Na próxima tela, informe apenas o resultado alcançado.`}</p></div>`;}
function scrAc(id){const a=ACOES.find(x=>x.id===id),s=S.a[id]||{},list=ACOES.filter(x=>x.k===a.k),idx=list.indexOf(a)+1;
 const motOn=s.real&&s.real!=="Sim";
 return `<div class="card"><div class="ctx"><b>KR ${a.k+1}</b>, ${esc(KRS[a.k].curto)}, ação ${idx} de ${list.length}</div>
  <div class="macro">Projeto: ${esc(a.p)}</div>
  <h2>${esc(a.t)}</h2>
  ${a.d?`<button class="more" data-more>Ver o que foi planejado</button><p class="desc hide" id="det">${esc(a.d)}</p>`:""}
  <p class="plan">Planejado para ${esc(a.q||"trimestre não definido")}${a.r?`, responsável ${esc(a.r)}`:""}</p>
  ${s.pre?`<div class="obs">Resposta pré-preenchida com o status da planilha (${esc(s.pre)}). Revise e edite o que for necessário.</div>`:""}
  ${a.o&&a.o!==s.com&&a.o!==s.sub?`<div class="obs">Anotação na planilha: ${esc(a.o)}</div>`:""}
  <div class="q"><span class="ql">Esta ação foi realizada?</span>${opts("real",REAL,s.real)}</div>
  <div class="q${COM[s.real]?"":" hide"}" id="qcom"><label class="ql" for="com" id="lcom">${COM[s.real]||""}</label><textarea id="com" data-f="com" placeholder="Explique o que foi entregue e como">${esc(s.com)}</textarea></div>
  <div class="q${motOn?"":" hide"}" id="qmot"><label class="ql" for="mot">Qual foi o principal motivo?</label>
   <select id="mot" data-f="mot"><option value="">Selecione</option>${MOTIVOS.map(m=>`<option${s.mot===m?" selected":""}>${m}</option>`).join("")}</select></div>
  <div class="q${SUBS[s.mot]?"":" hide"}" id="qsub"><label class="ql" for="sub" id="lsub">${SUBS[s.mot]?SUBS[s.mot][0]:""}</label><textarea id="sub" data-f="sub" placeholder="${SUBS[s.mot]?esc(SUBS[s.mot][1]):""}">${esc(s.sub)}</textarea></div>
</div>`;}
function scrRes(i){const k=KRS[i],ks=KR(i);
 return `<div class="card"><div class="ctx"><b>KR ${i+1}</b>, resultado</div><h2>Quanto foi alcançado em 2026?</h2>
  <p class="desc">${esc(k.texto)}. Informe o resultado acumulado (ou a média) de janeiro até hoje.</p>
  ${k.rel?`<div class="obs">Influenciado pelos KRs de: ${esc(k.rel)}</div>`:""}
  ${k.nota?`<div class="obs">${esc(k.nota)}</div>`:""}
  ${k.hist?`<div class="obs">Meta revisada nas revisões trimestrais. ${esc(k.hist)}</div>`:""}
  ${k.campos.map(c=>`<div class="f"><label class="ql" for="v-${c.id}">${esc(c.label)}${c.un?` (${c.un})`:""}</label>
   <input type="number" inputmode="decimal" step="any" id="v-${c.id}" data-kv="${c.id}" value="${esc(ks.v[c.id])}"${(ks.nd||{})[c.id]?" disabled":""}><div class="hint ${hintCls(c,ks.v[c.id])}${(ks.nd||{})[c.id]?" hide":""}" id="h-${c.id}">${hint(c,ks.v[c.id])}</div>
   <label class="nd"><input type="checkbox" data-nd="${c.id}"${(ks.nd||{})[c.id]?" checked":""}> Não temos esse dado</label></div>`).join("")}
  <div class="q${Object.values(ks.nd||{}).some(Boolean)?"":" hide"}" id="qnd"><label class="ql" for="ndobs">Por que esse dado não é medido? Como poderia ser medido em 2027?</label><textarea id="ndobs" data-kf="ndobs" placeholder="Ex.: o CRM não registra a etapa de qualificação; seria preciso padronizar o funil">${esc(ks.ndobs)}</textarea></div>
  <div class="f"><label class="ql" for="fonte">De onde vem esse número?</label><select id="fonte" data-kf="fonte"><option value="">Selecione</option>${FONTES.map(o=>`<option${ks.fonte===o?" selected":""}>${o}</option>`).join("")}</select></div>
  ${SETORES[SET].g?`<div class="q"><span class="ql">Quais setores mais contribuíram para este resultado? (pode marcar mais de um)</span><div class="opts">${(SETORES[SET].contrib||[]).map(o=>`<button type="button" class="opt${(ks.contrib||[]).includes(o)?" on":""}" data-mc="${o}" aria-pressed="${(ks.contrib||[]).includes(o)}">${o}</button>`).join("")}</div></div>
  <div class="q"><label class="ql" for="inf">O que mais influenciou o resultado, positiva ou negativamente?</label><textarea id="inf" data-kf="inf" placeholder="Ex.: queda de conversão no contábil no 2º semestre, aumento de cancelamentos por preço">${esc(ks.inf)}</textarea></div>`:""}
  ${!SETORES[SET].g?`<div class="q"><span class="ql">A meta deste KR foi revisada em alguma revisão trimestral?</span>${opts("krev",["Não","Sim"],ks.rev)}</div>
  <div class="q${ks.rev==="Sim"?"":" hide"}" id="qrev"><label class="ql" for="revobs">Qual foi a nova meta e em qual trimestre?</label><textarea id="revobs" data-kf="revobs" placeholder="Ex.: no 2º tri, a meta passou de 30% para 28%">${esc(ks.revobs)}</textarea></div>`:""}
  <div class="q"><span class="ql">Para 2027, este KR deve:</span>${opts("kfut",KRFUT,ks.fut)}</div>
  <div class="q"><label class="ql" for="sug">Sugestão para 2027 (opcional)</label><textarea id="sug" data-kf="sug" placeholder="Nova meta, novo indicador ou observação">${esc(ks.sug)}</textarea></div></div>`;}
function scrExtra(){return `<div class="card"><div class="ctx"><b>Fechamento</b></div><h2>O que foi feito em 2026 que não estava no plano?</h2>
  <p class="desc">Iniciativas relevantes que aconteceram fora do planejamento também contam como resultado do ano.</p>
  <div class="q">${S.extras.map((e,j)=>`<div class="ex"><input type="text" data-ex="${j}" value="${esc(e)}" placeholder="Descreva a iniciativa" aria-label="Iniciativa ${j+1}">${S.extras.length>1?`<button class="x" data-rm="${j}" aria-label="Remover">×</button>`:""}</div>`).join("")}</div>
  <button class="btn link" id="add" style="color:var(--pri)">Adicionar outra</button>
  <div class="q"><label class="ql" for="apr">Principal aprendizado de 2026 (opcional)</label><textarea id="apr" data-ap>${esc(S.aprend)}</textarea></div></div>`;}
function scrSum(){const tot=ACOES.length,c={Sim:0,Parcialmente:0,"Não":0};ACOES.forEach(a=>{const v=(S.a[a.id]||{}).real;if(v)c[v]++;});
 const p=n=>tot?Math.round(n/tot*100):0,col={Sim:"var(--ok)",Parcialmente:"var(--warn)","Não":"var(--bad)"};
 const ex=S.extras.filter(e=>e.trim());
 const subs=ACOES.filter(a=>{const x=S.a[a.id]||{};return SUBS[x.mot]&&(x.sub||"").trim();});
 const pend=ACOES.filter(a=>!acDone(a.id)).length;
 return `<div class="card${ACOES.length?"":" sem-acoes"}"><div class="ctx"><b>Resumo</b></div><h2>Avaliação: ${esc(SETORES[SET].nome)}</h2>
  ${pend?`<p class="desc">${pend} ${pend>1?"ações ainda estão incompletas":"ação ainda está incompleta"}. Você pode voltar e completar.</p>`:""}
  <div class="boxes"><div class="box"><div class="v">${p(c.Sim)}%</div><div class="k">realizadas</div></div><div class="box"><div class="v">${p(c.Parcialmente)}%</div><div class="k">parciais</div></div><div class="box"><div class="v">${p(c["Não"])}%</div><div class="k">não realizadas</div></div></div>
  <div class="sec sec-exec"><h3>Execução por KR</h3><p class="desc" style="margin:-4px 0 12px;font-size:13px">Clique em um KR para ver as ações.</p>${KRS.map((k,i)=>{const l=ACOES.filter(a=>a.k===i);
   if(!l.length)return `<div class="br nop"><span>${esc(k.curto)}</span><div class="bar"></div><span>sem ações</span></div>`;
   const ok=l.filter(a=>(S.a[a.id]||{}).real==="Sim").length;
   const bar=`<div class="bar">${REAL.map(r=>{const n=l.filter(a=>(S.a[a.id]||{}).real===r).length;return n?`<i style="width:${n/l.length*100}%;background:${col[r]}"></i>`:"";}).join("")}</div>`;
   const itens=l.map(a=>{const x=S.a[a.id]||{},r=x.real||"";const lbl={Sim:"Realizada",Parcialmente:"Parcial","Não":"Não realizada"}[r]||"Sem resposta";
     const det=r==="Não"?[x.mot,x.sub].filter(Boolean).join(": "):[x.com,r==="Parcialmente"&&x.mot&&x.mot!=="Ainda em andamento"?"Motivo: "+x.mot:""].filter(Boolean).join(" ");
     return `<li data-go-ac="${a.id}"><i class="dot" style="background:${col[r]||"var(--line)"}"></i><div><b>${esc(a.t)}</b><span class="tag">${lbl}</span>${det?`<p>${esc(det)}</p>`:""}</div></li>`;}).join("");
   return `<details class="kd"><summary class="br"><span>${esc(k.curto)}</span>${bar}<span>${ok} de ${l.length}</span></summary><ul class="itens">${itens}</ul></details>`;}).join("")}</div>
  <div class="sec"><h3>Resultado dos KRs</h3><div class="tbl"><table><thead><tr><th>Indicador</th><th>Meta</th><th>Realizado</th><th></th></tr></thead><tbody>
  ${KRS.map((k,i)=>k.campos.map(cp=>{const v=(S.k[i]||{v:{}}).v[cp.id],h=!vazio(v),ok=h&&bate(cp,v),sm=cp.meta==null;
   const nd=((S.k[i]||{}).nd||{})[cp.id];
   return `<tr><td>${esc(cp.label)}</td><td>${fmtMeta(cp)}${cp.orig!=null?`<br><span style="font-size:12px;color:var(--muted)">original ${fmt(cp.un,cp.orig)}</span>`:""}</td><td>${nd?"Não medido":h?fmt(cp.un,v):"–"}</td><td><span class="pill ${nd?"warn":!h?"off":sm?"off":ok?"ok":"bad"}">${nd?"Sem medição":!h?"Sem resposta":sm?"Sem meta":ok?"Atingida":"Não atingida"}</span></td></tr>`;}).join("")).join("")}
  </tbody></table></div></div>
  ${(()=>{const l=KRS.map((k,i)=>[k,S.k[i]||{}]).filter(([k,x])=>Object.values(x.nd||{}).some(Boolean));return l.length?`<div class="sec"><h3>Indicadores sem medição</h3><ul style="margin:0;padding-left:18px">${l.map(([k,x])=>`<li style="margin-bottom:8px"><b style="font-weight:500">${esc(k.curto)}</b>${x.ndobs?`<br><span style="color:var(--muted);font-size:13.5px">${esc(x.ndobs)}</span>`:""}</li>`).join("")}</ul></div>`:"";})()}
  ${SETORES[SET].g?`<div class="sec"><h3>Contribuição dos setores</h3><ul style="margin:0;padding-left:18px">${KRS.map((k,i)=>{const x=S.k[i]||{};return `<li style="margin-bottom:8px"><b style="font-weight:500">${esc(k.curto)}:</b> ${esc((x.contrib||[]).join(", ")||"não informado")}${x.inf?`<br><span style="color:var(--muted);font-size:13.5px">${esc(x.inf)}</span>`:""}</li>`;}).join("")}</ul></div>`:""}
  ${subs.length?`<div class="sec"><h3>Ações substituídas ou modificadas</h3><ul style="margin:0;padding-left:18px">${subs.map(a=>`<li><b style="font-weight:500">${esc(a.t)}</b><br><span style="color:var(--muted);font-size:13.5px">${S.a[a.id].mot.startsWith("Foi substituída")?"Substituída por: ":"Mudança: "}${esc(S.a[a.id].sub)}</span></li>`).join("")}</ul></div>`:""}
  ${ex.length?`<div class="sec"><h3>Feito fora do plano</h3><ul style="margin:0;padding-left:18px">${ex.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`:""}
  <p class="note">${sb?"As respostas são salvas automaticamente.":"Protótipo visual: as respostas ficam salvas apenas neste navegador."} <button class="btn link" id="reset" style="padding:0;font-size:12.5px;text-decoration:underline">Apagar respostas deste setor</button></p></div>`;}

function render(){
 const sc=document.getElementById("screen"),tr=document.getElementById("trocar");
 document.documentElement.dataset.emp=SET?(empDe(SET)||""):CONS?(CONS_EMP||""):(EMP||"");
 document.body.classList.toggle("wide",CONS);
 const topo=(html,titulo,btn)=>{sc.innerHTML=`<div class="screen">${html}</div>`;document.getElementById("bar").style.width="0";document.getElementById("pos").textContent="";document.getElementById("titulo").textContent=titulo;if(btn){tr.textContent=btn;tr.classList.remove("hide");}else tr.classList.add("hide");};
 if(CONS)return topo(scrCons(),"Visão consolidada"+(CONS_EMP?", "+EMPRESAS[CONS_EMP].curto:""),"Voltar");
 if(!SET)return topo(EMP?scrEmpresa(EMP):scrHome(),EMP?EMPRESAS[EMP].nome:"todas as empresas",EMP?"Trocar empresa":"");
 tr.textContent="Trocar setor";
 const s=SCR[S.pos];
 const html=s.t==="kr"?scrKR(s.k):s.t==="ac"?scrAc(s.id):s.t==="res"?scrRes(s.k):s.t==="extra"?scrExtra():scrSum();
 const last=S.pos===SCR.length-1;
 const nextLbl=s.t==="kr"?"Começar":s.t==="extra"?"Ver resumo":s.t==="res"&&s.k<KRS.length-1?"Ir para o próximo KR":"Próximo";
 sc.innerHTML=`<div class="screen">${html}<div class="nav"><button class="btn link" data-go="-1" ${S.pos===0?"disabled":""}>Voltar</button>${last?"":`<button class="btn pri" data-go="1">${nextLbl}</button>`}</div></div>`;
 document.getElementById("bar").style.width=(S.pos/(SCR.length-1)*100)+"%";
 document.getElementById("pos").textContent=s.k!=null?`KR ${s.k+1} de ${KRS.length}`:"";
 document.getElementById("titulo").textContent=SETORES[SET].nome;
 tr.classList.remove("hide");
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1900);}
function go(d){const s=SCR[S.pos];
 if(d>0&&s.t==="ac"){const a=S.a[s.id]||{};
  if(!a.real)return toast("Responda se a ação foi realizada para continuar.");
  if(COM[a.real]&&!(a.com||"").trim())return toast("Descreva o que foi realizado para continuar.");
  if(a.real!=="Sim"&&!a.mot)return toast("Selecione o principal motivo para continuar.");
  if(SUBS[a.mot]&&!(a.sub||"").trim())return toast("Descreva a ação que foi substituída ou modificada.");}
 S.pos=Math.max(0,Math.min(SCR.length-1,S.pos+d));save();render();window.scrollTo({top:0});}

document.addEventListener("click",e=>{const li=e.target.closest("[data-go-ac]");if(li&&SET){S.pos=SCR.findIndex(x=>x.id===li.dataset.goAc);save();render();window.scrollTo({top:0});return;}
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="tema"){const n=temaAtual()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem(TKEY,n);}catch(x){}iconeTema();return;}
 if(b.dataset.set){location.hash=b.dataset.set;return;}
 if(b.id==="trocar"){if(SET)location.hash=empDe(SET);else if(CONS&&CONS_EMP)location.hash=CONS_EMP;else{history.pushState("",document.title,location.pathname+location.search);SET=null;CONS=false;EMP=null;CONS_EMP=null;render();window.scrollTo({top:0});}return;}
 if(!SET)return;const s=SCR[S.pos];
 if(b.dataset.go)return go(+b.dataset.go);
 if(b.hasAttribute("data-more")){const d=document.getElementById("det");d.classList.toggle("hide");b.textContent=d.classList.contains("hide")?"Ver o que foi planejado":"Ocultar detalhes";return;}
 if(b.dataset.mc){const ks=KR(s.k);ks.contrib=ks.contrib||[];const v=b.dataset.mc,ix=ks.contrib.indexOf(v);if(ix<0)ks.contrib.push(v);else ks.contrib.splice(ix,1);b.classList.toggle("on",ix<0);b.setAttribute("aria-pressed",ix<0);save();return;}
 if(b.dataset.n){const n=b.dataset.n,v=b.dataset.v;let obj,f;
  if(n==="kfut"){obj=KR(s.k);f="fut";}else if(n==="krev"){obj=KR(s.k);f="rev";}else{obj=A(s.id);f=n;}
  obj[f]=obj[f]===v?"":v;
  b.parentElement.querySelectorAll(".opt").forEach(o=>{const on=o.dataset.v===obj[f];o.classList.toggle("on",on);o.setAttribute("aria-checked",on);});
  if(n==="krev")document.getElementById("qrev").classList.toggle("hide",obj.rev!=="Sim");
  if(n==="real"){const show=obj.real&&obj.real!=="Sim";
   document.getElementById("qcom").classList.toggle("hide",!COM[obj.real]);document.getElementById("lcom").textContent=COM[obj.real]||"";
   document.getElementById("qmot").classList.toggle("hide",!show);
   if(!show){obj.mot="";obj.sub="";document.getElementById("mot").value="";document.getElementById("sub").value="";document.getElementById("qsub").classList.add("hide");}}
  save();return;}
 if(b.id==="add"){S.extras.push("");save();render();const ins=document.querySelectorAll("[data-ex]");ins[ins.length-1].focus();return;}
 if(b.dataset.rm!=null){S.extras.splice(+b.dataset.rm,1);save();render();return;}
 if(b.id==="reset"&&confirm("Apagar as respostas deste setor? As respostas vindas da planilha serão restauradas.")){try{localStorage.removeItem(key(SET));}catch(x){}delete REMOTO[SET];S=load(SET);save();render();}
});
document.addEventListener("input",e=>{if(!SET)return;const t=e.target,s=SCR[S.pos];
 if(t.dataset.f){A(s.id)[t.dataset.f]=t.value;
  if(t.dataset.f==="mot"){const m=SUBS[t.value];document.getElementById("qsub").classList.toggle("hide",!m);if(m){document.getElementById("lsub").textContent=m[0];document.getElementById("sub").placeholder=m[1];}}}
 else if(t.dataset.nd){const ks=KR(s.k),id=t.dataset.nd;ks.nd=ks.nd||{};ks.nd[id]=t.checked;const inp=document.getElementById("v-"+id);inp.disabled=t.checked;if(t.checked){inp.value="";ks.v[id]="";}document.getElementById("h-"+id).classList.toggle("hide",t.checked);document.getElementById("qnd").classList.toggle("hide",!Object.values(ks.nd).some(Boolean));}
 else if(t.dataset.kv){const id=t.dataset.kv,c=KRS[s.k].campos.find(x=>x.id===id);KR(s.k).v[id]=t.value;const h=document.getElementById("h-"+id);h.textContent=hint(c,t.value);h.className="hint "+hintCls(c,t.value);}
 else if(t.dataset.kf){KR(s.k)[t.dataset.kf]=t.value;}
 else if(t.dataset.ex!=null){S.extras[+t.dataset.ex]=t.value;}
 else if(t.hasAttribute("data-ap")){S.aprend=t.value;}
 save();});
window.addEventListener("hashchange",()=>abrir(location.hash.slice(1)));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",iconeTema);
iconeTema();
if(sb){document.getElementById("screen").innerHTML='<div class="card"><p class="desc">Carregando avaliações...</p></div>';baixarTudo().finally(()=>abrir(location.hash.slice(1)));}
else abrir(location.hash.slice(1));

</script>
</body>
</html>
