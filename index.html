<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avaliação dos OKRs 2026 | Fortes Tecnologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--line:#e0dfd8;--ink:#23222b;--muted:#6b6a72;--soft:#f0eef8;
  --pri:#533AB7;--pri-ink:#ffffff;--ok:#1D9E75;--bad:#E24B4A;--warn:#BA7517;--off:#9a99a0;
  --ok-bg:#e6f5ef;--bad-bg:#fcebeb;--off-bg:#efefef;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161c;--card:#211f28;--line:#34323d;--ink:#ecebf2;--muted:#a3a1ad;--soft:#2a2735;
  --pri:#8b75e8;--pri-ink:#17161c;--ok:#3cc596;--bad:#f07170;--warn:#e0a24a;--off:#7f7d88;
  --ok-bg:#183229;--bad-bg:#3a1f22;--off-bg:#2b2a31;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161c;--card:#211f28;--line:#34323d;--ink:#ecebf2;--muted:#a3a1ad;--soft:#2a2735;
  --pri:#8b75e8;--pri-ink:#17161c;--ok:#3cc596;--bad:#f07170;--warn:#e0a24a;--off:#7f7d88;
  --ok-bg:#183229;--bad-bg:#3a1f22;--off-bg:#2b2a31;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Sora,Inter,system-ui,sans-serif;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px}
.wide .wrap{max-width:980px}
.sync{font-size:12px;color:var(--muted)}
.sync[data-s="salvo"]{color:var(--ok)}.sync[data-s="erro"]{color:var(--bad);cursor:help}
.boxes.b5{grid-template-columns:repeat(5,1fr)}
.box .v small{font-size:14px;color:var(--muted);font-weight:500}
.cs summary.br{grid-template-columns:minmax(150px,220px) 1fr 80px}
small{font-size:12px;color:var(--muted)}
.clist{list-style:none;margin:0;padding:0}
.clist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.clist li b{font-weight:500}
.clist li p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
@media (max-width:760px){.boxes.b5{grid-template-columns:1fr 1fr}.cs summary.br{grid-template-columns:1fr 70px}}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted)}
.head b{color:var(--ink);font-weight:600}
.prog{height:4px;background:var(--line);border-radius:4px;margin:10px 0 28px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.ctx{font-size:13px;color:var(--muted);margin-bottom:4px}
.ctx b{color:var(--pri);font-weight:600}
.macro{font-size:14px;color:var(--ink);font-weight:500;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
h2{font-size:21px;font-weight:600}
.big h2{font-size:24px}
.desc{color:var(--muted);font-size:14px;margin:10px 0 0}
.more{background:none;border:0;color:var(--pri);font-size:13px;padding:0;margin-top:8px;cursor:pointer}
.plan{font-size:13px;color:var(--muted);margin-top:12px}

.q{margin-top:26px}
.ql{display:block;font-weight:500;font-size:14px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 0;min-width:120px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:14px;text-align:center}
.opt:hover{border-color:var(--muted)}
.opt.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.opt.on[data-v="Sim"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.on[data-v="Parcialmente"]{background:var(--warn);border-color:var(--warn);color:#fff}
.opt.on[data-v="Não"]{background:var(--bad);border-color:var(--bad);color:#fff}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
textarea{min-height:76px;resize:vertical}
.hide{display:none}

.metas{margin:18px 0 0;padding:0;list-style:none}
.metas li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.metas li b{font-family:Sora,sans-serif;font-weight:600}
.f{margin-top:18px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 22px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.link{border:0;background:none;color:var(--muted);padding:11px 4px}
.btn:disabled{visibility:hidden}

.ex{display:flex;gap:8px;margin-top:10px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;padding:0 8px}

.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.box{background:var(--bg);border-radius:10px;padding:14px}
.box .v{font-family:Sora,sans-serif;font-size:24px;font-weight:600}
.box .k{font-size:12.5px;color:var(--muted)}
.sec{margin-top:26px}
.sec h3{font-size:15px;margin-bottom:10px}
.br{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.bar{display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12.5px}
.pill{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.warn{background:var(--off-bg);color:var(--warn)}
.nd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px;cursor:pointer;width:fit-content}
.nd input{width:16px;height:16px;accent-color:var(--pri);margin:0}
input:disabled{opacity:.45}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.off{background:var(--off-bg);color:var(--muted)}
.kd summary{list-style:none;cursor:pointer;border-radius:8px;padding:6px 8px;margin:0 -8px 2px}
.kd summary::-webkit-details-marker{display:none}
.kd summary:hover{background:var(--soft)}
.kd summary>span:first-child::before{content:"›";display:inline-block;width:14px;color:var(--pri);transition:transform .2s}
.kd[open] summary>span:first-child::before{transform:rotate(90deg)}
.br.nop{padding:6px 8px 6px 22px;margin:0 -8px 2px}
.itens{list-style:none;margin:4px 0 14px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.itens li{display:flex;gap:10px;padding:8px 0 8px 6px;cursor:pointer;border-radius:6px;font-size:13.5px}
.itens li:hover{background:var(--soft)}
.itens .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px}
.itens b{font-weight:500}
.itens .tag{display:inline-block;margin-left:8px;font-size:12px;color:var(--muted)}
.itens p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sem-acoes .boxes,.sem-acoes .sec-exec{display:none}
.note{font-size:12.5px;color:var(--muted);margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.screen{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:560px){.card{padding:22px}.boxes{grid-template-columns:1fr 1fr}.br{grid-template-columns:1fr 50px}.br .bar{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.head .r{display:flex;align-items:center;gap:10px}
.icon{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.setlink{background:none;border:0;color:var(--pri);cursor:pointer;font-size:13px;padding:0}
.sets{display:grid;gap:10px;margin-top:22px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 18px;cursor:pointer}
.set:hover{border-color:var(--pri)}
.set b{font-family:Sora,sans-serif;font-weight:600;font-size:16px;display:block}
.set span{font-size:13px;color:var(--muted)}
.set .st{font-size:12.5px;white-space:nowrap;text-align:right;color:var(--muted)}
.obs{font-size:13px;background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:10px}
</style>
</head>

<div class="wrap">
  <div class="head"><span><b>Avaliação dos OKRs 2026</b>, <span id="titulo"></span> <button class="setlink hide" id="trocar">Trocar setor</button></span><span class="r"><span id="sync" class="sync"></span><span id="pos"></span><button class="icon" id="tema" type="button"></button></span></div>
  <div class="prog"><i id="bar"></i></div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

 <button class="btn pri" data-set="consolidado" style="width:100%;margin-top:16px">Ver visão consolidada</button></div>`;

function krStatus(k,x){x=x||{};const v=x.v||{},nd=x.nd||{};
 const vals=k.campos.filter(c=>!vazio(v[c.id]));
 if(!vals.length)return Object.values(nd).some(Boolean)?"nd":"nr";
 const oks=vals.map(c=>bate(c,v[c.id]));
 return (k.curto==="Lucratividade"?oks.some(Boolean):oks.every(Boolean))?"ok":"bad";}
const ST_LBL={ok:"Atingido",bad:"Não atingido",nd:"Sem medição",nr:"Sem resposta"};
const ST_CLS={ok:"ok",bad:"bad",nd:"warn",nr:"off"};
function realizadoTxt(k,x){x=x||{};return k.campos.map(c=>((x.nd||{})[c.id])?"não medido":vazio((x.v||{})[c.id])?"–":fmt(c.un,x.v[c.id])).join(" / ");}

 const col={Sim:"var(--ok)",Parcialmente:"var(--warn)","Não":"var(--bad)"};

 let ta=0,c={Sim:0,Parcialmente:0,"Não":0},kc={ok:0,bad:0,nd:0,nr:0},mot={},ndL=[],revL=[],sugL=[],foraL=[];
 all.forEach(({s,cfg,st,ac})=>{ta+=ac.length;ac.forEach(a=>{const x=st.a[a.id]||{};if(x.real)c[x.real]++;if(x.mot&&x.mot!=="Ainda em andamento")mot[x.mot]=(mot[x.mot]||0)+1;});
  cfg.krs.forEach((k,i)=>{const x=st.k[i]||{};kc[krStatus(k,x)]++;
   if(Object.values(x.nd||{}).some(Boolean))ndL.push([cfg.nome,k.curto,x.ndobs]);
   if(x.rev==="Sim")revL.push([cfg.nome,k.curto,x.revobs]);
   if(x.fut||x.sug)sugL.push([cfg.nome,k.curto,x.fut,x.sug]);});
  (st.extras||[]).filter(e=>e&&e.trim()).forEach(e=>foraL.push([cfg.nome,e]));});
 const tk=kc.ok+kc.bad+kc.nd+kc.nr,p=n=>ta?Math.round(n/ta*100):0;
 const g=all[0];
 const geral=`<div class="sec"><h3>Objetivos gerais</h3><div class="tbl"><table><thead><tr><th>KR</th><th>Meta</th><th>Realizado</th><th></th><th>Setores que mais contribuíram</th></tr></thead><tbody>
  ${g.cfg.krs.map((k,i)=>{const x=g.st.k[i]||{},st=krStatus(k,x);return `<tr><td>${esc(k.curto)}</td><td>${k.campos.map(fmtMeta).join(" ou ")}</td><td>${realizadoTxt(k,x)}</td><td><span class="pill ${ST_CLS[st]}">${ST_LBL[st]}</span></td><td>${esc((x.contrib||[]).join(", ")||"–")}</td></tr>`;}).join("")}</tbody></table></div></div>`;
 const setores=`<div class="sec"><h3>Por setor</h3><p class="desc" style="margin:-4px 0 12px;font-size:13px">Clique em um setor para ver os KRs.</p>
  ${all.slice(1).map(({s,cfg,st,ac})=>{const n=ac.filter(a=>acDoneIn(st,a.id)).length,ok=cfg.krs.filter((k,i)=>krStatus(k,st.k[i])==="ok").length;
   const bar=`<div class="bar">${REAL.map(r=>{const m=ac.filter(a=>(st.a[a.id]||{}).real===r).length;return m?`<i style="width:${m/ac.length*100}%;background:${col[r]}"></i>`:"";}).join("")}</div>`;
   return `<details class="kd cs"><summary class="br"><span><b style="font-weight:600">${esc(cfg.nome)}</b><br><small>${n} de ${ac.length} ações avaliadas</small></span>${bar}<span>${ok} de ${cfg.krs.length} KRs</span></summary>
    <div class="tbl" style="margin:6px 0 16px"><table><thead><tr><th>KR</th><th>Meta</th><th>Realizado</th><th></th><th>Para 2027</th></tr></thead><tbody>
    ${cfg.krs.map((k,i)=>{const x=st.k[i]||{},stt=krStatus(k,x),l=ac.filter(a=>a.k===i),ex=l.filter(a=>(st.a[a.id]||{}).real==="Sim").length;
      return `<tr><td>${esc(k.curto)}<br><small>${l.length?`${ex} de ${l.length} ações realizadas`:"sem ações"}${x.rev==="Sim"?", meta revisada":""}</small></td><td>${k.campos.map(fmtMeta).join(k.curto==="Lucratividade"?" ou ":" / ")}</td><td>${realizadoTxt(k,x)}</td><td><span class="pill ${ST_CLS[stt]}">${ST_LBL[stt]}</span></td><td>${esc(x.fut||"–")}</td></tr>`;}).join("")}
    </tbody></table><button class="btn link" data-set="${s}" style="color:var(--pri);padding:8px 0">Abrir avaliação do setor</button></div></details>`;}).join("")}</div>`;
 const mk=Object.entries(mot).sort((a,b)=>b[1]-a[1]),mm=mk.length?mk[0][1]:1;
 const motivos=`<div class="sec"><h3>Por que ações não foram concluídas</h3>${mk.length?mk.map(([m,n])=>`<div class="br nop"><span>${esc(m)}</span><div class="bar"><i style="width:${n/mm*100}%;background:var(--warn)"></i></div><span>${n}</span></div>`).join(""):`<p class="desc">Nenhum motivo registrado ainda.</p>`}</div>`;
 const lista=(t,l,f)=>`<div class="sec"><h3>${t}</h3>${l.length?`<ul class="clist">${l.map(f).join("")}</ul>`:`<p class="desc">Nada registrado ainda.</p>`}</div>`;
 return `<div class="card"><div class="ctx"><b>Visão consolidada</b></div><h2>Fechamento dos OKRs 2026</h2>

   <div class="box"><div class="v">${p(c.Parcialmente)}%</div><div class="k">parciais</div></div>
   <div class="box"><div class="v">${p(c["Não"])}%</div><div class="k">não realizadas</div></div>
   <div class="box"><div class="v">${kc.ok}<small> de ${tk}</small></div><div class="k">KRs atingidos</div></div>
   <div class="box"><div class="v">${kc.nd}</div><div class="k">KRs sem medição</div></div></div>
  ${geral}${setores}${motivos}
  ${lista("Indicadores sem medição",ndL,([a,b,o])=>`<li><b>${esc(b)}</b> <small>${esc(a)}</small>${o?`<p>${esc(o)}</p>`:""}</li>`)}
  ${lista("Metas revisadas pelos setores",revL,([a,b,o])=>`<li><b>${esc(b)}</b> <small>${esc(a)}</small>${o?`<p>${esc(o)}</p>`:""}</li>`)}
  ${lista("Sugestões para 2027",sugL,([a,b,f,o])=>`<li><b>${esc(b)}</b> <small>${esc(a)}</small><p>${esc(f||"")}${f&&o?": ":""}${esc(o||"")}</p></li>`)}
  ${lista("Feito fora do plano",foraL,([a,e])=>`<li>${esc(e)} <small>${esc(a)}</small></li>`)}

function scrKR(i){const k=KRS[i],n=ACOES.filter(a=>a.k===i).length;
 return `<div class="card big"><div class="ctx"><b>KR ${i+1} de ${KRS.length}</b></div><h2>${esc(k.texto)}</h2>

function scrSum(){const tot=ACOES.length,c={Sim:0,Parcialmente:0,"Não":0};ACOES.forEach(a=>{const v=(S.a[a.id]||{}).real;if(v)c[v]++;});

   if(!l.length)return `<div class="br nop"><span>${esc(k.curto)}</span><div class="bar"></div><span>sem ações</span></div>`;

     return `<li data-go-ac="${a.id}"><i class="dot" style="background:${col[r]||"var(--line)"}"></i><div><b>${esc(a.t)}</b><span class="tag">${lbl}</span>${det?`<p>${esc(det)}</p>`:""}</div></li>`;}).join("");
   return `<details class="kd"><summary class="br"><span>${esc(k.curto)}</span>${bar}<span>${ok} de ${l.length}</span></summary><ul class="itens">${itens}</ul></details>`;}).join("")}</div>
  <div class="sec"><h3>Resultado dos KRs</h3><div class="tbl"><table><thead><tr><th>Indicador</th><th>Meta</th><th>Realizado</th><th></th></tr></thead><tbody>

function render(){
 const sc=document.getElementById("screen");
 document.body.classList.toggle("wide",CONS);const tr=document.getElementById("trocar");
 if(CONS){sc.innerHTML=`<div class="screen">${scrCons()}</div>`;document.getElementById("bar").style.width="0";document.getElementById("pos").textContent="";document.getElementById("titulo").textContent="Visão consolidada";tr.textContent="Voltar aos setores";tr.classList.remove("hide");return;}
 tr.textContent="Trocar setor";
 if(!SET){sc.innerHTML=`<div class="screen">${scrHome()}</div>`;document.getElementById("bar").style.width="0";document.getElementById("pos").textContent="";document.getElementById("titulo").textContent="Fortes Tecnologia";document.getElementById("trocar").classList.add("hide");return;}
 const s=SCR[S.pos];
 const html=s.t==="kr"?scrKR(s.k):s.t==="ac"?scrAc(s.id):s.t==="res"?scrRes(s.k):s.t==="extra"?scrExtra():scrSum();
 const last=S.pos===SCR.length-1;
 const nextLbl=s.t==="kr"?"Começar":s.t==="extra"?"Ver resumo":s.t==="res"&&s.k<KRS.length-1?"Ir para o próximo KR":"Próximo";
 sc.innerHTML=`<div class="screen">${html}<div class="nav"><button class="btn link" data-go="-1" ${S.pos===0?"disabled":""}>Voltar</button>${last?"":`<button class="btn pri" data-go="1">${nextLbl}</button>`}</div></div>`;
 document.getElementById("bar").style.width=(S.pos/(SCR.length-1)*100)+"%";
 document.getElementById("pos").textContent=s.k!=null?`KR ${s.k+1} de ${KRS.length}`:"";
 document.getElementById("titulo").textContent=SETORES[SET].nome;
 document.getElementById("trocar").classList.remove("hide");
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1900);}
function go(d){const s=SCR[S.pos];
